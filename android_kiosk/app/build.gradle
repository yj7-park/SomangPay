plugins {
    id 'com.android.application'
}

android {
    namespace 'com.somangpay.kiosk'
    compileSdk 35
    // AGP 8.6의 기본 build-tools는 34.0.0인데, compileSdk 35엔 35.0.0을 맞춰 쓴다
    // (CI의 "Install Android SDK platform 35" 단계가 이 버전을 깐다).
    buildToolsVersion "35.0.0"

    defaultConfig {
        minSdk 24
        // targetSdk 35(Android 15). 34에 머물면 API 37+ 기기에서 Play 프로텍트가
        // "이전 버전에 맞게 개발된 앱" 경고를 띄운다(대상 API가 기기 API보다 2단계
        // 초과로 낮을 때). 35부터 강제되는 edge-to-edge는 res/values-v35/themes.xml의
        // android:windowOptOutEdgeToEdgeEnforcement로 껐다(테마 Theme.SomangPay).
        // 이 opt-out은 API 36에서 무시되므로 targetSdk 36으로 올릴 땐 WindowInsets
        // 패딩 처리를 별도로 넣어야 한다.
        targetSdk 35
        // CI가 -PappVersionCode=<run_number>로 매 릴리스마다 고유 번호를 주입한다.
        // 로컬 수동 빌드에서는 프로퍼티가 없으니 1/"1.0.0"으로 폴백.
        // versionName은 frontend/version.json이 기록하는 "1.0.<run_number>"와 동일한
        // 규칙이어야 앱 내 버전 표시(update-widget.js)가 서버가 아는 최신 버전과 같게 보인다.
        versionCode project.hasProperty('appVersionCode') ? (project.appVersionCode as Integer) : 1
        versionName project.hasProperty('appVersionCode') ? ("1.0." + project.appVersionCode) : "1.0.0"
    }

    // BuildConfig.TARGET_URL / KIOSK_LOCKDOWN_ENABLED 필드 생성을 위해 명시적으로 켬
    // (AGP 8.0부터 buildConfig 생성이 기본 꺼짐으로 바뀜).
    buildFeatures {
        buildConfig true
    }

    // debug 빌드(assemble*Debug)가 붙을 개발 서버. 코드(AppConfig.TARGET_URL)가
    // BuildConfig.DEBUG 로 운영/개발 URL 을 고른다. trycloudflare 퀵터널 주소는 cloudflared
    // 를 재시작할 때마다 새로 발급돼 고정이 아니다 - 아래는 최근 값이고, 바뀌면
    //   ./gradlew assembleKioskDebug -PdevTargetHost=https://<새-서브도메인>.trycloudflare.com
    // 처럼 프로퍼티로 덮어쓴다(파일 수정 불필요). release 빌드는 이 값을 아예 쓰지 않는다.
    def devTargetHost = (project.findProperty('devTargetHost')
            ?: 'https://rescue-python-signature-grain.trycloudflare.com').toString().replaceAll('/+$', '')

    // 릴리스 APK 빌드(assemble*Release)는 기본으로 lintVitalRelease를 함께 돌린다.
    // AGP를 올리면 새로 생기거나 심각도가 올라간 lint 규칙 때문에 코드 변경 없이도
    // APK 릴리스 파이프라인이 깨질 수 있어, 릴리스 경로에서는 lint 게이트를 끈다
    // (품질 점검은 필요할 때 ./gradlew lint로 따로 돌린다).
    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    // 키오스크(전용 단말기, 락다운 적용) / 관리자·회원(일반 휴대폰, 락다운 없음) 세 앱을
    // 같은 코드베이스에서 URL과 락다운 여부만 바꿔 빌드한다. 카드 리더 브릿지(reader 패키지,
    // AndroidInterface, 내장 NFC)는 URL/락다운과 무관해 세 플레이버가 그대로 공유한다.
    flavorDimensions = ["target"]
    productFlavors {
        kiosk {
            dimension "target"
            applicationId "com.somangpay.kiosk"
            resValue "string", "app_name", "소망페이 키오스크"
            buildConfigField "String", "TARGET_URL", '"https://somangpay.duckdns.org/kiosk"'
            buildConfigField "String", "DEV_TARGET_URL", "\"${devTargetHost}/kiosk\""
            buildConfigField "boolean", "KIOSK_LOCKDOWN_ENABLED", "true"
            buildConfigField "boolean", "SMS_DETECT_ENABLED", "false"
        }
        admin {
            dimension "target"
            applicationId "com.somangpay.admin"
            resValue "string", "app_name", "소망페이 관리자"
            // Oracle Cloud VPS(somangpay.duckdns.org)로 이전 - Let's Encrypt 정식 인증서를 쓰므로
            // 예전 자체서명 인증서 때 wss:// 웹소켓이 막히던 문제(onReceivedSslError 우회가
            // REST/XHR에만 적용되고 웹소켓엔 안 먹힘)가 없어 https로 정상 접속된다.
            buildConfigField "String", "TARGET_URL", '"https://somangpay.duckdns.org/admin"'
            buildConfigField "String", "DEV_TARGET_URL", "\"${devTargetHost}/admin\""
            buildConfigField "boolean", "KIOSK_LOCKDOWN_ENABLED", "false"
            // 입금 문자 자동감지는 관리자 앱에서만 의미가 있다 - 키오스크/회원 앱에는 SMS 권한
            // 프롬프트 자체를 띄우지 않기 위해 플레이버별로 껐다 켰다 한다(코드는 공유, 플래그만 분기).
            buildConfigField "boolean", "SMS_DETECT_ENABLED", "true"
        }
        user {
            dimension "target"
            applicationId "com.somangpay.user"
            resValue "string", "app_name", "소망페이"
            buildConfigField "String", "TARGET_URL", '"https://somangpay.duckdns.org/user"'
            buildConfigField "String", "DEV_TARGET_URL", "\"${devTargetHost}/user\""
            buildConfigField "boolean", "KIOSK_LOCKDOWN_ENABLED", "false"
            buildConfigField "boolean", "SMS_DETECT_ENABLED", "false"
        }
    }

    // 릴리스 서명 키 - CI(GitHub Actions)에서는 아래 환경변수로 전용 릴리스 키스토어를 주입한다
    // (RELEASE_KEYSTORE_BASE64 등 GitHub Secrets, release-apk.yml 참고).
    // 로컬 개발 머신에서 환경변수가 없을 때만 디버그 키스토어로 폴백해 수동 빌드/테스트가 가능하게 한다.
    // 디버그 키로 서명된 APK는 실제 기기에 설치된 release 빌드 위에 업데이트 설치가 되지 않으니
    // (서명 불일치) 로컬 폴백은 어디까지나 임시 확인용이다.
    def releaseStoreFilePath = System.getenv('RELEASE_KEYSTORE_PATH')
    def hasReleaseSigningEnv = releaseStoreFilePath != null

    signingConfigs {
        release {
            if (hasReleaseSigningEnv) {
                storeFile file(releaseStoreFilePath)
                storePassword System.getenv('RELEASE_KEYSTORE_PASSWORD')
                keyAlias System.getenv('RELEASE_KEY_ALIAS')
                keyPassword System.getenv('RELEASE_KEY_PASSWORD')
            } else {
                storeFile file(System.getProperty('user.home') + '/.android/debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        // 로컬 개발용. applicationId 에 .debug 를 붙여 기기에 운영 앱과 나란히 설치되고,
        // 런처 아이콘은 app/src/debug/res 오버레이가 빨간 배경 + DEV 리본으로 덮어써서
        // 운영 빌드와 한눈에 구분된다. TARGET_URL 은 AppConfig 가 DEV_TARGET_URL 로 분기.
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-dev"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // targetSdk 35에 맞춰 Android 15 대응 버전으로 올림(구버전은 인셋/윈도우 처리에
    // 알려진 문제가 있음). appcompat 1.7.0이 androidx.core 1.13.x를 함께 끌어온다.
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.webkit:webkit:1.8.0'
    // 관리자 앱은 웹소켓(wss)이 WebView에서 자체서명 인증서와 막히는 문제 때문에 http로
    // 접속하는데, http에서는 브라우저 getUserMedia(웹 카메라)가 OS 권한과 무관하게 아예
    // 동작하지 않는다(비보안 컨텍스트 제약). 그래서 QR 스캔은 네이티브로 대체한다 - Play
    // Services 의존성이 없는 zxing-android-embedded를 사용(ML Kit은 Play Services 필요).
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    // 관리자 앱 전용 AdminAlertService(포그라운드 서비스로 /ws/admin에 계속 붙어 있다가
    // 서버가 보내는 관리자 알림을 네이티브 알림으로 띄움 - WebView가 Web Push를 지원하지
    // 않아 우회하는 경로, admin.html 상단 주석 참고)의 WebSocket 클라이언트. 프레임
    // 마스킹/핑퐁/재연결을 직접 구현하는 대신 검증된 라이브러리를 쓴다.
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
