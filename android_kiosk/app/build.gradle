plugins {
    id 'com.android.application'
}

android {
    namespace 'com.somangpay.kiosk'
    compileSdk 34

    defaultConfig {
        minSdk 24
        targetSdk 34
        // CI가 -PversionCode=<run_number>로 매 릴리스마다 고유 번호를 주입한다.
        // 로컬 수동 빌드에서는 프로퍼티가 없으니 1로 폴백.
        versionCode project.hasProperty('appVersionCode') ? (project.appVersionCode as Integer) : 1
        versionName "1.0.0"
    }

    // BuildConfig.TARGET_URL / KIOSK_LOCKDOWN_ENABLED 필드 생성을 위해 명시적으로 켬
    // (AGP 8.0부터 buildConfig 생성이 기본 꺼짐으로 바뀜).
    buildFeatures {
        buildConfig true
    }

    // 키오스크(전용 단말기, 락다운 적용) / 관리자·회원(일반 휴대폰, 락다운 없음) 세 앱을
    // 같은 코드베이스에서 URL과 락다운 여부만 바꿔 빌드한다. 카드 리더 브릿지(reader 패키지,
    // AndroidInterface, 내장 NFC)는 URL/락다운과 무관해 세 플레이버가 그대로 공유한다.
    flavorDimensions = ["target"]
    productFlavors {
        kiosk {
            dimension "target"
            applicationId "com.somangpay.kiosk"
            resValue "string", "app_name", "소망페이 키오스크"
            buildConfigField "String", "TARGET_URL", '"https://125.248.31.132/kiosk"'
            buildConfigField "boolean", "KIOSK_LOCKDOWN_ENABLED", "true"
            buildConfigField "boolean", "SMS_DETECT_ENABLED", "false"
        }
        admin {
            dimension "target"
            applicationId "com.somangpay.admin"
            resValue "string", "app_name", "소망페이 관리자"
            // http로 접속 - 자체서명 인증서 위의 wss:// 웹소켓은 안드로이드 WebView에서
            // onReceivedSslError 우회가 적용되지 않아 조용히 막힌다(REST/XHR는 우회되는 것과 다름).
            // 어차피 자체서명 인증서라 실질 보안 이득이 없던 상태라 http로 내려 이 제약을 피한다.
            // 80번 포트는 공유기의 WAN측 원격 관리 웹UI가 이미 점유하고 있어 포트포워딩이 겹치므로,
            // 대신 8080을 써서 공유기 관리 페이지와 충돌하지 않게 한다(공유기: 외부 8080 → PC의 80).
            buildConfigField "String", "TARGET_URL", '"http://125.248.31.132:8080/admin"'
            buildConfigField "boolean", "KIOSK_LOCKDOWN_ENABLED", "false"
            // 입금 문자 자동감지는 관리자 앱에서만 의미가 있다 - 키오스크/회원 앱에는 SMS 권한
            // 프롬프트 자체를 띄우지 않기 위해 플레이버별로 껐다 켰다 한다(코드는 공유, 플래그만 분기).
            buildConfigField "boolean", "SMS_DETECT_ENABLED", "true"
        }
        user {
            dimension "target"
            applicationId "com.somangpay.user"
            resValue "string", "app_name", "소망페이"
            buildConfigField "String", "TARGET_URL", '"http://125.248.31.132:8080/user"'
            buildConfigField "boolean", "KIOSK_LOCKDOWN_ENABLED", "false"
            buildConfigField "boolean", "SMS_DETECT_ENABLED", "false"
        }
    }

    // 릴리스 서명 키 - CI(GitHub Actions)에서는 아래 환경변수로 전용 릴리스 키스토어를 주입한다
    // (RELEASE_KEYSTORE_BASE64 등 GitHub Secrets, release-apk.yml 참고).
    // 로컬 개발 머신에서 환경변수가 없을 때만 디버그 키스토어로 폴백해 수동 빌드/테스트가 가능하게 한다.
    // 디버그 키로 서명된 APK는 실제 기기에 설치된 release 빌드 위에 업데이트 설치가 되지 않으니
    // (서명 불일치) 로컬 폴백은 어디까지나 임시 확인용이다.
    def releaseStoreFilePath = System.getenv('RELEASE_KEYSTORE_PATH')
    def hasReleaseSigningEnv = releaseStoreFilePath != null

    signingConfigs {
        release {
            if (hasReleaseSigningEnv) {
                storeFile file(releaseStoreFilePath)
                storePassword System.getenv('RELEASE_KEYSTORE_PASSWORD')
                keyAlias System.getenv('RELEASE_KEY_ALIAS')
                keyPassword System.getenv('RELEASE_KEY_PASSWORD')
            } else {
                storeFile file(System.getProperty('user.home') + '/.android/debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.webkit:webkit:1.8.0'
    // 관리자 앱은 웹소켓(wss)이 WebView에서 자체서명 인증서와 막히는 문제 때문에 http로
    // 접속하는데, http에서는 브라우저 getUserMedia(웹 카메라)가 OS 권한과 무관하게 아예
    // 동작하지 않는다(비보안 컨텍스트 제약). 그래서 QR 스캔은 네이티브로 대체한다 - Play
    // Services 의존성이 없는 zxing-android-embedded를 사용(ML Kit은 Play Services 필요).
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
