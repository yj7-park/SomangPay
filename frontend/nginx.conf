server {
    listen 80;
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # .apk는 SPA 폴백(index.html)으로 넘기면 안 된다 - CI가 아직 안 만들어 파일이 없을 때
    # 폴백을 타면 "성공적으로" index.html을 text/html 200으로 내려주게 되고, 안드로이드 크롬은
    # 이 조그만 HTML을 .apk로 저장하려다 검증에 실패해 다운로드가 계속 일시중지/보류된다.
    # 파일이 없으면 조용히 index.html을 내려주는 대신 그냥 404를 내려준다.
    location ~* \.apk$ {
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ws/ {
        proxy_pass http://backend:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    location /kiosk {
        try_files /kiosk.html =404;
    }

    location /user {
        try_files /user.html =404;
    }

    location /admin {
        try_files /admin.html =404;
    }
}

server {
    listen 443 ssl;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # .apk는 SPA 폴백(index.html)으로 넘기면 안 된다 - CI가 아직 안 만들어 파일이 없을 때
    # 폴백을 타면 "성공적으로" index.html을 text/html 200으로 내려주게 되고, 안드로이드 크롬은
    # 이 조그만 HTML을 .apk로 저장하려다 검증에 실패해 다운로드가 계속 일시중지/보류된다.
    # 파일이 없으면 조용히 index.html을 내려주는 대신 그냥 404를 내려준다.
    location ~* \.apk$ {
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ws/ {
        proxy_pass http://backend:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    location /kiosk {
        try_files /kiosk.html =404;
    }

    location /user {
        try_files /user.html =404;
    }

    location /admin {
        try_files /admin.html =404;
    }
}
