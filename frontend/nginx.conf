server {
    listen 80;
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # .apk는 SPA 폴백(index.html)으로 넘기면 안 된다 - CI가 아직 안 만들어 파일이 없을 때
    # 폴백을 타면 "성공적으로" index.html을 text/html 200으로 내려주게 되고, 안드로이드 크롬은
    # 이 조그만 HTML을 .apk로 저장하려다 검증에 실패해 다운로드가 계속 일시중지/보류된다.
    # 파일이 없으면 조용히 index.html을 내려주는 대신 그냥 404를 내려준다.
    # Cache-Control: no-store는 별개 문제 대응 - CI가 새 빌드를 같은 파일명에 덮어쓰므로
    # "/SomangPayXxx.apk"는 항상 최신을 가리키는 고정 URL이어야 하는데, 캐시 헤더가 없으면
    # admin.html을 새 버전 배포 전에 미리 열어둔 브라우저가 서버에 묻지도 않고 예전에 캐싱해둔
    # apk를 그대로 반환해버릴 수 있다 - 매 다운로드마다 서버에서 새로 받아오도록 강제한다.
    location ~* \.apk$ {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # 앱이 실행 시마다 조회하는 업데이트 매니페스트도 같은 이유로 캐싱을 금지한다
    # (android_kiosk/UpdateManager.java가 여기서 최신 versionCode를 읽는다).
    location = /version.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ws/ {
        proxy_pass http://backend:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    # 매번 서버에 최신인지 물어보고 쓰게 강제(no-cache=재검증 필수, no-store와 다름) -
    # 이 헤더가 없어서 브라우저가 예전 admin.html/manifest*.json을 계속 들고 있다가
    # PWA manifest/서비스워커 등록 코드가 새로 반영 안 되는 문제를 두 번 겪었다(#push).
    location /kiosk {
        add_header Cache-Control "no-cache";
        try_files /kiosk.html =404;
    }

    location /user {
        add_header Cache-Control "no-cache";
        try_files /user.html =404;
    }

    location /admin {
        add_header Cache-Control "no-cache";
        try_files /admin.html =404;
    }

    location ~* ^/manifest(-[a-z]+)?\.json$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}

server {
    listen 443 ssl;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # .apk는 SPA 폴백(index.html)으로 넘기면 안 된다 - CI가 아직 안 만들어 파일이 없을 때
