       android_kiosk의 app/src/kiosk/res/drawable/ic_launcher_foreground.xml과
       동일한 좌표/색상을 공유한다. -->
  <path fill="#1f1e59" d="M40.255,21.600 L50.073,21.600 L50.073,31.418 L40.255,31.418 Z M67.745,31.418 L77.564,31.418 L77.564,41.236 L67.745,41.236 Z M30.436,49.091 L40.255,49.091 L40.255,58.909 L30.436,58.909 Z M40.255,76.582 L50.073,76.582 L50.073,86.400 L40.255,86.400 Z"/>
