  <path fill="#131532" d="M57.927,49.091 L67.745,49.091 L67.745,58.909 L57.927,58.909 Z"/>
  <!-- 뱃지를 원래 좌표(중심 84.24,84.24 / 반지름 20.52)로 그리면 안드로이드 런처 스퀴클
       마스크 코너에서 잘려나가는 게 실기기에서 확인되어(android_kiosk의 3개 플레이버
       foreground XML과 동일한 이슈), 뱃지만 0.8배 축소 + 어댑티브 아이콘의 진짜 보장 안전
       영역(108 캔버스 중앙 66dp *지름* 원, 즉 중심(54,54)/반지름 33 - 스퀴클이 아니라 완전
       원형 마스크 기준)에 원 전체가 들어오도록 (64.64,64.64)로 당기는 변환을 적용한다(#37:
       기존 0.9배/70,70은 원형 마스크에서 뱃지 우상단이 실제로 잘려 PWA 설치 아이콘과 다르게
       보이는 게 확인됨 - 0.6배/66.73 때보다는 커야 한다는 #36 요구도 유지하면서 안전 영역
       계산으로 재조정한 값). 로고 마크 본체는 건드리지 않는다. -->
  <g transform="translate(64.64,64.64) scale(0.8) translate(-84.24,-84.24)">
