name: Build & Release Kiosk APK

# main에 머지될 때마다 소망페이 키오스크 안드로이드 앱을 release 빌드로 컴파일해서
# GitHub Release에 올리고, admin 대시보드가 항상 최신 빌드를 받아가도록
# frontend/SomangPayKiosk.apk도 함께 갱신해 커밋한다.
#
# 이 워크플로우 자신이 만드는 커밋 메시지에는 [skip ci]가 들어있어 무한 재실행을 방지한다
# (GitHub Actions는 head 커밋 메시지에 [skip ci]/[ci skip]이 있으면 push 트리거를 자동으로 건너뜀).
on:
  push:
    branches: [main]
    paths:
      - "android_kiosk/**"
      - ".github/workflows/release-apk.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache/setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode release keystore
        working-directory: android_kiosk
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Build release APK
        working-directory: android_kiosk
        env:
          RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/android_kiosk/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PappVersionCode=${{ github.run_number }} --console=plain

      - name: Remove decoded keystore
        if: always()
        working-directory: android_kiosk
        run: rm -f release.keystore

      - name: Prepare release metadata
        id: meta
        run: |
          echo "tag=build-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "apk_path=${{ github.workspace }}/SomangPayKiosk.apk" >> "$GITHUB_OUTPUT"
          cp android_kiosk/app/build/outputs/apk/release/app-release.apk "${{ github.workspace }}/SomangPayKiosk.apk"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" \
            "${{ steps.meta.outputs.apk_path }}" \
            --title "Kiosk APK build #${{ github.run_number }}" \
            --notes "커밋 ${{ github.sha }} 기준 자동 빌드 (main 머지 트리거)."

      - name: Publish latest APK to frontend (served by admin download link)
        run: |
          cp "${{ steps.meta.outputs.apk_path }}" frontend/SomangPayKiosk.apk
          sed -i -E "s#(/SomangPayKiosk\.apk\?v=)[^\"]*#\1${{ github.run_number }}#" frontend/admin.html
          rm -f "${{ steps.meta.outputs.apk_path }}"

      - name: Commit updated APK + admin link
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/SomangPayKiosk.apk frontend/admin.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: publish kiosk APK build #${{ github.run_number }} [skip ci]"
          git push origin HEAD:main
